# Optional: keeps stickers/<pack>/manifest.json and stickers/packs.json in sync with the image files,
# so adding a sticker is just "drop the image into its pack folder and push".
name: Update sticker manifests
on:
  push:
    paths:
      - 'stickers/**/*.png'
      - 'stickers/**/*.webp'
      - 'stickers/**/*.gif'
      - 'stickers/**/*.jpg'
      - 'stickers/**/*.jpeg'
      - 'stickers/**/*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 stickers/build-manifests.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain stickers)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stickers
            git commit -m "Update sticker manifests"
            git push
          fi
