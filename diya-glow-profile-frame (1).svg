<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gold" x1="110" y1="90" x2="405" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0A6"/>
      <stop offset=".18" stop-color="#D88A24"/>
      <stop offset=".36" stop-color="#FFF0A0"/>
      <stop offset=".58" stop-color="#A94D12"/>
      <stop offset=".78" stop-color="#F8C75C"/>
      <stop offset="1" stop-color="#8F3D0D"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8C8"/>
      <stop offset=".48" stop-color="#F6C65C"/>
      <stop offset="1" stop-color="#B45A16"/>
    </linearGradient>
    <linearGradient id="diyaBowl" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF0A0"/>
      <stop offset=".35" stop-color="#F8B52E"/>
      <stop offset="1" stop-color="#B6530E"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="65%" r="65%">
      <stop stop-color="#FFFDE0"/>
      <stop offset=".35" stop-color="#FFF19A"/>
      <stop offset=".72" stop-color="#FFAE21"/>
      <stop offset="1" stop-color="#E65A0B" stop-opacity=".15"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="petal">
      <path d="M0 -202 C-13 -190 -15 -174 0 -162 C15 -174 13 -190 0 -202Z" fill="url(#goldLight)" stroke="#8F3D0D" stroke-width="2.2"/>
      <path d="M0 -195 C-5 -185 -5 -176 0 -169 C5 -176 5 -185 0 -195Z" stroke="#FFF2B0" stroke-width="1.6"/>
      <circle cy="-181" r="3.2" fill="#FFF4BD"/>
    </g>
    <g id="smallOrnament">
      <path d="M0 -190 C-9 -181 -8 -170 0 -164 C8 -170 9 -181 0 -190Z" fill="#B95B17" stroke="#F9D477" stroke-width="2"/>
      <path d="M0 -185 C-3 -178 -3 -173 0 -169 C3 -173 3 -178 0 -185Z" fill="#FFE9A0"/>
      <circle cy="-158" r="2.5" fill="#FFF0B0"/>
    </g>
    <g id="sideDiya">
      <ellipse cy="-2" rx="25" ry="5" fill="#8E3C0C" opacity=".35"/>
      <path d="M-24 -8 Q0 3 24 -8 Q19 12 0 14 Q-19 12 -24 -8Z" fill="url(#diyaBowl)" stroke="#9A430E" stroke-width="2"/>
      <path d="M-21 -8 Q0 -1 21 -8" stroke="#FFF0A0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0 -11 C-10 -23 -4 -34 0 -42 C7 -31 10 -22 0 -11Z" fill="url(#flame)" filter="url(#tinyGlow)"/>
      <path d="M0 -12 Q-2 -21 1 -27" stroke="#8D3C0C" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-24" r="2" fill="#FFFDE0"/>
    </g>
  </defs>

  <!-- Fine ornamental halo -->
  <circle cx="256" cy="245" r="207" stroke="#9E4B13" stroke-width="2" opacity=".8"/>
  <circle cx="256" cy="245" r="203" stroke="url(#goldLight)" stroke-width="3"/>

  <!-- Repeating floral petals around the frame -->
  <g transform="translate(256 245)">
    <use href="#petal"/><use href="#petal" transform="rotate(15)"/><use href="#petal" transform="rotate(30)"/>
    <use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(60)"/><use href="#petal" transform="rotate(75)"/>
    <use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(105)"/><use href="#petal" transform="rotate(120)"/>
    <use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(150)"/><use href="#petal" transform="rotate(165)"/>
    <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(195)"/><use href="#petal" transform="rotate(210)"/>
    <use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(255)"/>
    <use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(285)"/><use href="#petal" transform="rotate(300)"/>
    <use href="#petal" transform="rotate(315)"/><use href="#petal" transform="rotate(330)"/><use href="#petal" transform="rotate(345)"/>
    <use href="#smallOrnament" transform="rotate(7.5)"/><use href="#smallOrnament" transform="rotate(22.5)"/>
    <use href="#smallOrnament" transform="rotate(37.5)"/><use href="#smallOrnament" transform="rotate(52.5)"/>
    <use href="#smallOrnament" transform="rotate(67.5)"/><use href="#smallOrnament" transform="rotate(82.5)"/>
    <use href="#smallOrnament" transform="rotate(97.5)"/><use href="#smallOrnament" transform="rotate(112.5)"/>
    <use href="#smallOrnament" transform="rotate(127.5)"/><use href="#smallOrnament" transform="rotate(142.5)"/>
    <use href="#smallOrnament" transform="rotate(157.5)"/><use href="#smallOrnament" transform="rotate(172.5)"/>
    <use href="#smallOrnament" transform="rotate(187.5)"/><use href="#smallOrnament" transform="rotate(202.5)"/>
    <use href="#smallOrnament" transform="rotate(217.5)"/><use href="#smallOrnament" transform="rotate(232.5)"/>
    <use href="#smallOrnament" transform="rotate(247.5)"/><use href="#smallOrnament" transform="rotate(262.5)"/>
    <use href="#smallOrnament" transform="rotate(277.5)"/><use href="#smallOrnament" transform="rotate(292.5)"/>
    <use href="#smallOrnament" transform="rotate(307.5)"/><use href="#smallOrnament" transform="rotate(322.5)"/>
    <use href="#smallOrnament" transform="rotate(337.5)"/><use href="#smallOrnament" transform="rotate(352.5)"/>
  </g>

  <!-- Raised gold frame ring; centre remains transparent -->
  <circle cx="256" cy="245" r="174" stroke="#7D350C" stroke-width="17"/>
  <circle cx="256" cy="245" r="174" stroke="url(#gold)" stroke-width="13"/>
  <circle cx="256" cy="245" r="164" stroke="#FFF0A0" stroke-width="2.5" opacity=".9"/>
  <circle cx="256" cy="245" r="157" stroke="#C77A24" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <circle cx="256" cy="245" r="151" stroke="#FBE5A0" stroke-width="1.5" opacity=".75"/>

  <!-- Small decorative jewels around the inner rim -->
  <g fill="#FFF0A0" stroke="#B45A16" stroke-width="1.4">
    <circle cx="256" cy="83" r="4"/><circle cx="336" cy="104" r="3.5"/><circle cx="397" cy="165" r="3.5"/>
    <circle cx="418" cy="245" r="4"/><circle cx="397" cy="325" r="3.5"/><circle cx="336" cy="386" r="3.5"/>
    <circle cx="256" cy="407" r="4"/><circle cx="176" cy="386" r="3.5"/><circle cx="115" cy="325" r="3.5"/>
    <circle cx="94" cy="245" r="4"/><circle cx="115" cy="165" r="3.5"/><circle cx="176" cy="104" r="3.5"/>
  </g>

  <!-- Central diya, intentionally overlapping the lower frame edge -->
  <g transform="translate(256 390)">
    <ellipse cy="17" rx="61" ry="10" fill="#8C3909" opacity=".25"/>
    <path d="M-57 -3 Q0 12 57 -3 Q49 43 0 48 Q-49 43 -57 -3Z" fill="url(#diyaBowl)" stroke="#8F3B0B" stroke-width="3"/>
    <path d="M-52 -4 Q0 10 52 -4" stroke="#FFF2A5" stroke-width="4" stroke-linecap="round"/>
    <path d="M-38 8 Q0 19 38 8" stroke="#F7D16C" stroke-width="2" opacity=".8"/>
    <path d="M0 -9 C-20 -36 -8 -62 0 -82 C13 -59 19 -34 0 -9Z" fill="url(#flame)" filter="url(#softGlow)"/>
    <path d="M0 -10 C-4 -27 3 -42 1 -53" stroke="#8B3A0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -20 C-7 -34 -3 -45 0 -53 C6 -40 7 -30 0 -20Z" fill="#FFFBE0" opacity=".9"/>
    <circle cy="-37" r="3" fill="#FFFDE4" filter="url(#tinyGlow)"/>
  </g>

  <!-- Two smaller side diyas -->
  <use href="#sideDiya" transform="translate(94 429) scale(1.02)"/>
  <use href="#sideDiya" transform="translate(418 429) scale(1.02)"/>

  <!-- Tiny gold spark accents -->
  <g fill="#FFE7A0" filter="url(#tinyGlow)">
    <path d="M110 391 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2Z"/>
    <path d="M402 389 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2Z"/>
    <path d="M256 42 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2Z"/>
  </g>
</svg>
